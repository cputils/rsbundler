[tools]
rust = { version = "1.97.1", components = "rust-analyzer,clippy,rustfmt", targets = "x86_64-unknown-linux-musl" }
lefthook = "2.1.10"
zizmor = "1.27.0"
dprint = "0.55.2"

[hooks]
postinstall = "lefthook install"

[tasks.check]
run = [
  "cargo clippy --fix --allow-dirty --allow-staged",
  "cargo fmt",
  "cargo test --quiet",
  "dprint fmt",
  "zizmor . --offline",
]

[tasks.build-static-linux-x86_64]
description = "Build a fully static Linux x86-64 executable"
run = "cargo build --release --target x86_64-unknown-linux-musl"
